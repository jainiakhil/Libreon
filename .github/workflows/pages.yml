# The website lives at https://libreon.pages.dev/ (Cloudflare Pages publishes site/).
# This keeps the old address, https://jainiakhil.github.io/Libreon/, working: every page
# there forwards to the same page on the new address.
name: Forward old website address

on:
  push:
    branches: [main]
    paths: ['site-src/forward/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Forwarding page for every address (404.html catches files and old links)
        run: |
          mkdir _site
          cp site-src/forward/index.html _site/index.html
          cp site-src/forward/index.html _site/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
