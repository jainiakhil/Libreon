name: Bug report
description: Something in Libreon doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please don't attach private documents; if you can, recreate the problem with a harmless file.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "I opened a PDF form, tapped a text field, and the keyboard did not appear."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
  - type: dropdown
    id: kind
    attributes:
      label: Type of file
      options:
        - Word (docx, doc, odt, rtf)
        - Excel (xlsx, xls, ods)
        - PowerPoint (pptx, ppt, odp)
        - PDF
        - Text, Markdown or CSV
        - Apple Pages, Numbers or Keynote
        - Not about a file
  - type: input
    id: version
    attributes:
      label: Libreon version
      description: Libreon → ⋮ → Settings → About
      placeholder: "0.9.0-beta.4"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Samsung Galaxy S24 Ultra, Android 17"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help show the problem.
